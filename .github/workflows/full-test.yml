name: Full Test

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'OS to test'
        required: true
        type: string
      version:
        description: 'ROCm version to test'
        required: false
        type: string
        default: latest
      method:
        description: 'Method to test'
        required: false
        type: string
        default: auto
      debug:
        description: 'Enable debug logging'
        required: false
        type: boolean
        default: false
      expect-failure:
        description: 'Expect the action step to fail (used to test version resolution failures)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 0'

jobs:
  Test:
    name: Test
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_test.yml
    with:
      os: ${{ inputs.os }}
      version: ${{ inputs.version }}
      method: ${{ inputs.method }}
      debug: ${{ inputs.debug }}
      expect-failure: ${{ inputs.expect-failure }}

  Full-Test:
    name: Full Test
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - windows-2022
          - windows-2025
        method:
          - package-manager
          - runfile
          - pip
          - auto
        version:
          - latest
        exclude:
          # Windows has two routes (HIP SDK installer and pip). `package-manager` and `runfile`
          # are treated as `auto` there, and `auto` + `latest` already lands on the pip route,
          # so the explicit `pip` entry would duplicate it.
          - os: windows-2022
            method: package-manager
          - os: windows-2022
            method: runfile
          - os: windows-2022
            method: pip
          - os: windows-2025
            method: package-manager
          - os: windows-2025
            method: runfile
          - os: windows-2025
            method: pip
        include:
          # The HIP SDK installer route only wins `auto` for versions the pip index does not
          # ship, so pin the newest installer version to keep that route exercised weekly.
          - os: windows-2022
            method: auto
            version: '7.2'
    uses: ./.github/workflows/_test.yml
    with:
      os: ${{ matrix.os }}
      version: ${{ matrix.version }}
      method: ${{ matrix.method }}
      debug: true
